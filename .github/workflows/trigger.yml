name: CI

on:
  push:
    branches: ["main", "develop", "v*.*.*", "hotfix/*/*", "fix/*", "maint/*", feat/*]
  pull_request:
    branches: ["main"]

jobs:
  build_linux:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      output1: ${{steps.filter.outputs.workflows}}
    steps:
      - uses: actions/checkout@v2
      - name: Build
        run: |
          # Copy envs
          cp .env.example .env

          # Remove the rc tag
          sed -i -E 's/(version *= *")([0-9]+\.[0-9]+(\.[0-9]+)?)(rc[0-9]+)?(")/\1\2\5/' ./pyproject.toml

          # Install task
          sudo sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

          # Install pre-commit
          pip install pre-commit
          pre-commit install

          # Build (docker + wsd[all])
          task build
        shell: bash

  build_mac:
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v2
      - name: Build on macOS
        run: |
          # Copy envs
          cp .env.example .env

          # Remove the rc tag
          sed -i '' -E 's/(version *= *")([0-9]+\.[0-9]+(\.[0-9]+)?)(rc[0-9]+)?(")/\1\2\5/' ./pyproject.toml

          # Install task
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

          # Install pre-commit
          pip install pre-commit
          pre-commit install

          # Build
          pip install wsd[all] --break-system-packages

        shell: bash
